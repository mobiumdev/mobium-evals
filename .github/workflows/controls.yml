# Every task's controls, each night, on a GitHub-hosted Android 15 emulator
# and an iOS 27 simulator: the reference solution must pass, and doing
# nothing and the wrong thing must fail. They drive no model and spend
# nothing, so this runs free;
# what it catches is the harness or Mobium no longer able to tell pass from
# fail — a control gone stale, a task that cannot set up, a device that stops
# answering. Agents are measured by nightly/nightly.sh on a machine of one's
# own, where the model is chosen and paid for.
#
# Mobium is built from mobiumdev/mobium's main. MobiumApp and Morpho Market
# (for t25) come from their latest releases. The emulator is set up as
# mobiumdev/mobium's Linux quick start sets it up, the run that passed there.
name: Controls

on:
  schedule:
    - cron: '0 10 * * *' # 03:00 Pacific in summer, 02:00 in winter
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  android-15:
    # mobiumdev's copy only: GitHub's runners are free for a public
    # repository, and a private copy would spend its monthly minutes
    # repeating this run.
    if: github.repository_owner == 'mobiumdev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /home/runner/sdk
      ANDROID_SDK_ROOT: /home/runner/sdk
      MOBIUM_HOME: /home/runner/mobium-home
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: mobiumdev/mobium
          path: mobium

      # The AVD's userdata partition needs 12GB; the runner has about 8.7GB
      # free until the toolchains this job does not use are gone.
      - name: Disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /home/runner

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-go@v6
        with:
          go-version-file: mobium/go.mod

      - name: Build Mobium
        working-directory: mobium
        run: |
          go build -o "$RUNNER_TEMP/mobium" ./cmd/mobium
          {
            echo "MOBIUM_BIN=$RUNNER_TEMP/mobium"
            echo "MOBIUM_REPO=$GITHUB_WORKSPACE/mobium"
            echo "MOBIUM_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Apps under test
        run: |
          gh release download -R mobiumdev/mobium-app -p MobiumApp-android.apk -D apks
          gh release download -R mobiumdev/morpho-market -p MorphoMarket-android.apk -D apks

      - name: Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q tools.zip && mv cmdline-tools latest && rm tools.zip
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: SDK packages and AVD
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > /dev/null
          avdmanager create avd -n mobium-test -d pixel_7 -k "system-images;android-35;google_apis;x86_64" | tail -1

      # Four cores and 4 GB, of the runner's four and 16 GB: with the defaults,
      # steps ran slowly enough to fail on time alone (t25, 2026-10-31).
      - name: Boot the emulator
        run: |
          nohup emulator -avd mobium-test -cores 4 -memory 4096 -no-window -no-snapshot -no-boot-anim -no-audio -no-metrics -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          for _ in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
          # A new device's first minutes rewrite its settings — Google Play
          # services' flags, scheduler constants, about 100 keys — and a
          # trial that ran through them was charged with the change (t01's
          # reference, 2026-10-30). Wait until a minute passes with none,
          # up to ten.
          prev=""; same=0
          for _ in $(seq 1 40); do
            # shellcheck disable=SC2016  # $n expands in the device's shell
            h=$(adb shell 'for n in global secure system; do settings list $n; done' | sha1sum | cut -c1-12)
            if [ "$h" = "$prev" ]; then same=$((same + 1)); else same=0; fi
            echo "settings $h, unchanged for $((same * 15)) s"
            [ "$same" -ge 4 ] && break
            prev=$h; sleep 15
          done
          adb install -r apks/MobiumApp-android.apk
          adb install -r apks/MorphoMarket-android.apk

      - name: Controls
        run: |
          export MOBIUM_EVALS_APKS="$PWD/apks/MobiumApp-android.apk:$PWD/apks/MorphoMarket-android.apk"
          uv run mobium-evals --device emulator-5554 --seed "$(date +%Y%m%d)" controls

      - name: Stop
        if: always()
        run: |
          "$MOBIUM_BIN" daemon stop || true
          adb emu kill || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: controls-android-15
          path: |
            runs/
            ${{ runner.temp }}/emulator.log

  # The tasks that run on iOS, on a new iPhone 18 Pro simulator (iOS 27.0)
  # on the xcode-27 image: GitHub's macOS runners run iOS simulators, though
  # not Android emulators. MobiumApp comes from its latest release; Mobium
  # builds WebDriverAgent for the simulator on first use, a few minutes.
  ios-27:
    if: github.repository_owner == 'mobiumdev'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: mobiumdev/mobium
          path: mobium

      - uses: actions/setup-go@v6
        with:
          go-version-file: mobium/go.mod

      - name: Build Mobium
        working-directory: mobium
        run: |
          go build -o "$RUNNER_TEMP/mobium" ./cmd/mobium
          {
            echo "MOBIUM_BIN=$RUNNER_TEMP/mobium"
            echo "MOBIUM_REPO=$GITHUB_WORKSPACE/mobium"
            echo "MOBIUM_COMMIT=$(git rev-parse HEAD)"
            # Short: the daemon's socket path must stay under 104 bytes.
            echo "MOBIUM_HOME=$RUNNER_TEMP/mh"
          } >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Simulator and MobiumApp
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"] and r["version"].startswith("27.0")]
          print(rs[0]["identifier"])')
          sim=$(xcrun simctl create mobium-ci "iPhone 18 Pro" "$runtime")
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b > /dev/null
          gh release download -R mobiumdev/mobium-app -p MobiumApp-ios-simulator.zip -D app
          unzip -q app/MobiumApp-ios-simulator.zip -d app
          xcrun simctl install "$sim" app/MobiumApp.app
          echo "SIM=$sim" >> "$GITHUB_ENV"

      - name: Controls
        run: uv run mobium-evals --device "$SIM" --seed "$(date +%Y%m%d)" controls

      - name: Stop
        if: always()
        run: |
          "$MOBIUM_BIN" daemon stop || true
          xcrun simctl shutdown all || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: controls-ios-27
          path: runs/
